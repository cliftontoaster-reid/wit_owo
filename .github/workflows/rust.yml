name: Rust Continuous Testing Integration
on:
  push:
    branches: [main, v*.*.x]
    paths:
      - src/**
      - Cargo.toml
      - Cargo.lock
      - assets/**
      - .trunk/**
      - .github/workflows/rust.yml
      - .github/actions-rs/**
  pull_request:
    branches: [main, v*.*.x]
    paths:
      - src/**
      - Cargo.toml
      - Cargo.lock
      - assets/**
      - .trunk/**
      - .github/workflows/rust.yml
      - .github/actions-rs/**

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: nightly
          components: rustfmt, clippy

      - name: Annotate commit with clippy warnings
        uses: actions-rs/clippy-check@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          args: --all-features

      - name: Security audit
        uses: actions-rs/audit-check@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  check:
    name: Run Tests
    needs: lint
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta, nightly]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt

      - name: Build
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --all-features --verbose

      - name: Run Clippy per OS/Rust version
        uses: actions-rs/clippy-check@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          args: --all-features -- -D warnings

      - name: Compile tests, but do not run
        uses: actions-rs/cargo@v1
        with:
          command: test
          args: --all-features --no-run --verbose

  test:
    name: Run Tests
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: nightly
          components: clippy, llvm-tools-preview

      - name: Set Rust to Nightly
        run: |
          rustup default nightly

      - name: Run Tests with Coverage
        uses: actions-rs/cargo@v1
        with:
          command: test
          args: --all-features --verbose
        env:
          CARGO_INCREMENTAL: "0"
          RUSTFLAGS: "-Cinstrument-coverage -Ccodegen-units=1 -Cinline-threshold=0 -Clink-dead-code -Coverflow-checks=off -Cpanic=abort -Zpanic_abort_tests"
          RUSTDOCFLAGS: "-Ccodegen-units=1 -Cinline-threshold=0 -Clink-dead-code -Coverflow-checks=off -Cpanic=abort -Zpanic_abort_tests"
          LLVM_PROFILE_FILE: "./target/coverage-%p-%m.profraw"
          WIT_API_TOKEN: ${{ secrets.WIT_API_TOKEN }}

      - name: Generate coverage report
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.rust == 'nightly' }}
        id: coverage
        uses: actions-rs/grcov@v0.1

      - name: Upload coverage to Codecov
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.rust == 'nightly' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
          fail_ci_if_error: true
